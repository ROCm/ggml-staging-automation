name: Release

on:
  # Run every day at 02:00 UTC.
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag/version. Defaults to hrx-b<workflow run number>."
        required: false
        type: string
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check_source_changes:
    name: Check source changes
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.check.outputs.should_publish }}
    steps:
      - name: Compare with latest release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            {
              echo "### Release source check"
              echo
              echo "Manual dispatch: publishing was explicitly requested."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          latest_tag="$(
            gh release list \
              --repo "$GITHUB_REPOSITORY" \
              --exclude-drafts \
              --limit 1 \
              --json tagName \
              --jq '.[0].tagName // empty'
          )"

          if [[ -z "$latest_tag" ]]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            {
              echo "### Release source check"
              echo
              echo "No existing release was found; publishing the initial release."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          released_sha="$(
            gh release view "$latest_tag" \
              --repo "$GITHUB_REPOSITORY" \
              --json targetCommitish \
              --jq '.targetCommitish'
          )"

          if [[ ! "$released_sha" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Release $latest_tag does not record an exact commit SHA: $released_sha" >&2
            exit 1
          fi

          if [[ "$GITHUB_SHA" == "$released_sha" ]]; then
            should_publish=false
            decision="No source change; skipping build, tests, and publishing."
          else
            should_publish=true
            decision="Source changed; continuing with the release."
          fi

          echo "should_publish=$should_publish" >> "$GITHUB_OUTPUT"
          {
            echo "### Release source check"
            echo
            printf -- '- Latest release: `%s`\n' "$latest_tag"
            printf -- '- Released source commit: `%s`\n' "$released_sha"
            printf -- '- Current source commit: `%s`\n' "$GITHUB_SHA"
            echo
            echo "$decision"
          } >> "$GITHUB_STEP_SUMMARY"

  prepare_release:
    name: Prepare
    runs-on: ubuntu-latest
    needs: check_source_changes
    if: needs.check_source_changes.outputs.should_publish == 'true'
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact_name: ${{ steps.version.outputs.artifact_name }}
      asset_name: ${{ steps.version.outputs.asset_name }}
    steps:
      - name: Determine version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION:-hrx-b${GITHUB_RUN_NUMBER}}"
          if [[ ! "$version" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "Release version must contain only letters, numbers, '.', '_', and '-'." >&2
            exit 1
          fi
          artifact_name="llama-${version}-bin-manylinux-hrx-x64"
          asset_name="${artifact_name}.tar.gz"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
          echo "asset_name=$asset_name" >> "$GITHUB_OUTPUT"

  llama_cpp_manylinux_hrx:
    name: Linux / HRX
    needs: prepare_release
    uses: ./.github/workflows/build_llama_cpp_linux.yml
    permissions:
      contents: read
    with:
      name: Build
      artifact_name: ${{ needs.prepare_release.outputs.artifact_name }}
      package_file_name: ${{ needs.prepare_release.outputs.asset_name }}
      package_root_name: llama-${{ needs.prepare_release.outputs.version }}
      build_type: Release
      hrx_build_type: Release
      upload_artifact: true
      build_test_package: true
      test_artifact_name: ${{ needs.prepare_release.outputs.artifact_name }}-tests

  llama_cpp_release_tests:
    name: Linux / HRX release tests
    needs:
      - prepare_release
      - llama_cpp_manylinux_hrx
    uses: ./.github/workflows/release_tests.yml
    permissions:
      contents: read
      actions: read
    with:
      name: Release tests
      release_artifact_name: ${{ needs.prepare_release.outputs.artifact_name }}
      test_artifact_name: ${{ needs.prepare_release.outputs.artifact_name }}-tests
      package_root_name: llama-${{ needs.prepare_release.outputs.version }}
      allow_failure: true

  publish_release:
    name: Publish
    runs-on: ubuntu-latest
    needs:
      - prepare_release
      - llama_cpp_manylinux_hrx
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.prepare_release.outputs.artifact_name }}
          path: release

      - name: Verify release artifact
        env:
          VERSION: ${{ needs.prepare_release.outputs.version }}
          ASSET_NAME: ${{ needs.prepare_release.outputs.asset_name }}
        run: |
          set -euo pipefail
          test -f "release/$ASSET_NAME"
          tar -tzf "release/$ASSET_NAME" > release/archive-contents.txt
          grep -q "^llama-${VERSION}/bin/" release/archive-contents.txt
          grep -q "^llama-${VERSION}/lib/" release/archive-contents.txt

      - name: Create release notes
        env:
          VERSION: ${{ needs.prepare_release.outputs.version }}
          ASSET_NAME: ${{ needs.prepare_release.outputs.asset_name }}
        run: |
          set -euo pipefail
          commit_message="$(git log -1 --pretty=%B)"
          {
            echo "<details open>"
            echo
            printf '%s\n' "$commit_message"
            echo
            echo "</details>"
            echo
            echo "**Linux:**"
            echo "- [Manylinux x64 (HRX)](https://github.com/${GITHUB_REPOSITORY}/releases/download/${VERSION}/${ASSET_NAME})"
            echo
            echo "HRX ROCm runtime dependencies required by this build are bundled in the archive."
          } > release-notes.md

      - name: Create prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare_release.outputs.version }}
          ASSET_NAME: ${{ needs.prepare_release.outputs.asset_name }}
        run: |
          set -euo pipefail
          gh release create "$VERSION" "release/$ASSET_NAME" \
            --prerelease \
            --latest=false \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --notes-file release-notes.md
