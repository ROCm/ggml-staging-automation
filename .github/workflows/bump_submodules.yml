name: Bump integration submodules

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:
    inputs:
      hrx_commit:
        description: "hrx-system commit SHA. Defaults to the latest main commit."
        required: false
        type: string
        default: ""
      llama_commit:
        description: "llama.cpp commit SHA. Defaults to the latest hrx-graph-develop commit."
        required: false
        type: string
        default: ""

permissions:
  checks: read
  contents: write
  pull-requests: write

concurrency:
  group: bump-integration-submodules
  cancel-in-progress: false

jobs:
  bump:
    name: Update submodule pins
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      # The automation's commit identity: used as author/committer on the
      # bump commit, and by the guard script to tell the automation's
      # commits apart from human ones.
      BOT_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      # The rolling PR's head branch: force-pushed by the create-pull-request
      # step and inspected by the guard script.
      BUMP_BRANCH: users/automation/bump-submodules

    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Check bump branch for human commits or failing CI
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/hrx/bump/check_bump_branch.py | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Update submodules
        if: steps.guard.outputs.proceed == 'true'
        id: submodules
        env:
          HRX_COMMIT: ${{ inputs.hrx_commit }}
          LLAMA_COMMIT: ${{ inputs.llama_commit }}
        run: |
          set -euo pipefail
          python3 scripts/hrx/bump/update_submodules.py

      - name: Create or update pull request
        if: steps.guard.outputs.proceed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          # A token is required to trigger PR CI automatically. GITHUB_TOKEN is
          # the fallback; close and reopen its PR to trigger CI.
          token: ${{ secrets.SUBMODULE_BUMP_TOKEN || github.token }}
          add-paths: |
            hrx-system
            llama.cpp
          commit-message: Bump integration submodules
          committer: github-actions[bot] <${{ env.BOT_EMAIL }}>
          author: github-actions[bot] <${{ env.BOT_EMAIL }}>
          branch: ${{ env.BUMP_BRANCH }}
          delete-branch: true
          base: main
          title: Bump integration submodules
          body: |
            Automated update of the integration submodules:

            | Submodule | Tracked branch | From | To |
            | --- | --- | --- | --- |
            | [`hrx-system`](https://github.com/ROCm/hrx-system) | `main` | [`${{ steps.submodules.outputs.hrx_from_short }}`](https://github.com/ROCm/hrx-system/commit/${{ steps.submodules.outputs.hrx_from }}) | [`${{ steps.submodules.outputs.hrx_to_short }}`](https://github.com/ROCm/hrx-system/commit/${{ steps.submodules.outputs.hrx_to }}) |
            | [`llama.cpp`](https://github.com/ROCm/llama-cpp-temp-fork) | `hrx-graph-develop` | [`${{ steps.submodules.outputs.llama_from_short }}`](https://github.com/ROCm/llama-cpp-temp-fork/commit/${{ steps.submodules.outputs.llama_from }}) | [`${{ steps.submodules.outputs.llama_to_short }}`](https://github.com/ROCm/llama-cpp-temp-fork/commit/${{ steps.submodules.outputs.llama_to }}) |

            While this PR has failing checks, newer pins are not pushed — the
            failure needs attention first. To discard this PR and re-create it
            at the latest pins, close it; the next scheduled run opens a fresh
            one. If commits were pushed to the branch by hand, delete the
            branch as well (the "Delete branch" button on the closed PR).
