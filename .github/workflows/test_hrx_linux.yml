name: Test packaged HRX suites

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: linux-gfx1151-gpu-rocm
    timeout-minutes: 40
    steps:
      - name: Checkout automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install CTest
        run: |
          sudo -n apt-get update
          sudo -n apt-get install -y --no-install-recommends cmake

      - name: Download HRX test package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hrx-tests
          path: artifacts

      - name: Extract HRX test package
        run: |
          python3 scripts/hrx/package/extract_release_package.py \
            --archive artifacts/hrx-tests.tar.gz \
            --package-root-name hrx-tests \
            --output-dir release/hrx-tests

      - name: Run packaged HRX suites on gfx1151
        run: python3 scripts/hrx/ci/run_hrx_tests.py

      - name: Upload HRX test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hrx-test-results-gfx1151
          path: |
            release/hrx-tests/metadata.json
            release/hrx-tests/results/
            release/hrx-tests/Testing/
          if-no-files-found: error
          retention-days: 45
