name: Test llama.cpp Release Linux

on:
  workflow_call:
    inputs:
      name:
        type: string
        default: Release tests
      release_artifact_name:
        type: string
        required: true
      test_artifact_name:
        type: string
        default: llama-cpp-linux-x86_64-tests
      package_root_name:
        type: string
        default: llama.cpp-install
      allow_failure:
        description: Allow release validation jobs to fail without failing the calling workflow.
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  test_llama_cpp_release_linux:
    name: ${{ inputs.name }} (${{ matrix.gpu_target }})
    continue-on-error: ${{ inputs.allow_failure }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gfx1151_strix-halo
            gpu_target: gfx1151
            runs_on: linux-gfx1151-gpu-rocm
          - name: gfx1201_9070
            gpu_target: gfx1201
            runs_on: linux-gfx120X-gpu-rocm
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 20
    steps:
      - name: Download llama.cpp release package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.release_artifact_name }}
          path: artifacts

      - name: Download llama.cpp test package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.test_artifact_name }}
          path: artifacts

      - name: Extract package artifacts
        env:
          RELEASE_ARTIFACT_NAME: ${{ inputs.release_artifact_name }}
          TEST_ARTIFACT_NAME: ${{ inputs.test_artifact_name }}
        run: |
          release_package="artifacts/${RELEASE_ARTIFACT_NAME}.tar.gz"
          test_package="artifacts/${TEST_ARTIFACT_NAME}.tar.gz"
          extract_dir="release_with_tests"

          rm -rf "$extract_dir"
          mkdir -p "$extract_dir"

          tar -xzf "$release_package" -C "$extract_dir"
          tar -xzf "$test_package" -C "$extract_dir"

      - name: Run installed GPU tests
        env:
          PACKAGE_ROOT_NAME: ${{ inputs.package_root_name }}
        run: |
          prefix="release_with_tests/${PACKAGE_ROOT_NAME}"

          ldd "$prefix/bin/test-backend-ops"
          # test-backend-ops supports an include list but not an exclude list.
          # Build the include list from --list-ops, omitting currently unsupported ops.
          ops_filter="$("$prefix/bin/test-backend-ops" --list-ops | awk '
            BEGIN {
              unsupported["GET_ROWS"] = 1
            }
            # Operation lines have exactly one field. Append supported op names
            # to a comma-separated filter for test-backend-ops -o.
            # In awk, NF is the number of whitespace-separated fields, NF == 1 skips header row.
            NF == 1 && !($1 in unsupported) {
              ops = ops sep $1
              sep = ","
            }
            END { print ops }
          ')"
          for backend in HRX0 Vulkan0; do
            "$prefix/bin/test-backend-ops" test -b "$backend" -o "$ops_filter"
          done
