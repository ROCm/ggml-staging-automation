name: CI

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  matched_llama1b:
    name: Metadata reuse versus initial PR on one gfx1151 runner
    runs-on: linux-gfx1151-gpu-rocm
    timeout-minutes: 45
    steps:
      - name: Reject known faulty halobox-b13 runner
        if: ${{ contains(runner.name, 'halobox-b13') }}
        run: exit 1

      - name: Checkout comparison harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Vulkan driver
        run: |
          sudo -n apt-get update
          sudo -n apt-get install -y --no-install-recommends mesa-vulkan-drivers

      - name: Download baseline source-built release
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: llama-cpp-linux-x86_64
          run-id: 36658779016
          github-token: ${{ github.token }}
          path: matched-packages/before

      - name: Download candidate source-built release
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: llama-cpp-linux-x86_64
          run-id: 36711935840
          github-token: ${{ github.token }}
          path: matched-packages/after

      - name: Run interleaved throughput and unchanged perplexity checks
        run: |
          python3 scripts/hrx/benchmark/run_matched_llama1b.py \
            --packages-dir "$PWD/matched-packages" \
            --output-dir "$PWD/matched-results"

      - name: Upload raw comparison evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: matched-llama1b-gfx1151
          path: matched-results
          if-no-files-found: error
          retention-days: 45

      - name: Remove downloaded release archives
        if: ${{ always() }}
        run: rm -rf "$PWD/matched-packages"
