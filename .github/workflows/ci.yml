name: CI

on:
  workflow_dispatch:
    inputs:
      skip_benchmarks:
        description: 'JSON list of benchmark IDs to skip, e.g. ["lemonade-benchmark"] or ["perplexity"].'
        type: string
        default: '[]'
      model_tier:
        description: Model tier to benchmark.
        required: true
        type: choice
        default: full
        options:
          - smoke
          - full
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: read

jobs:
  llama_cpp_release_bench:
    name: Linux / HRX release benchmark
    uses: ./.github/workflows/release_test_bench.yml
    permissions:
      contents: read
      actions: read
    with:
      name: Release benchmark
      release_artifact_name: llama-cpp-linux-x86_64
      package_root_name: llama.cpp-install
      model_tier: ${{ github.event_name == 'pull_request' && 'smoke' || inputs.model_tier || 'full' }}
      skip_benchmarks: ${{ inputs.skip_benchmarks || '[]' }}
