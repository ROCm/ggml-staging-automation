name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  llama_cpp_linux:
    name: Linux / llama.cpp / HRX
    uses: ./.github/workflows/build_llama_cpp_linux.yml
    permissions:
      contents: read
    with:
      name: Linux / llama.cpp / HRX
      artifact_name: llama-cpp-linux-x86_64
      build_type: Release
      hrx_build_type: Release
      upload_artifact: true
