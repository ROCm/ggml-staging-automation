name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  standalone_package:
    name: Build standalone metadata reuse
    uses: ./.github/workflows/build_llama_cpp_linux.yml
    with:
      name: Build
      artifact_name: llama-cpp-linux-x86_64
      build_type: Release
      hrx_build_type: Release
      package_root_name: llama.cpp-install
      upload_artifact: true
