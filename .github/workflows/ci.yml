name: CI

on:
  workflow_dispatch:
    inputs:
      test_backend_ref:
        description: 'Test-only backend SHA (empty uses normal pin); labels this run as qualification.'
        type: string
        default: ''
      skip_benchmarks:
        description: 'JSON list of benchmark IDs to skip, e.g. ["lemonade-benchmark"] or ["perplexity"].'
        type: string
        default: '[]'
      model_tier:
        description: Model tier to benchmark.
        required: true
        type: choice
        default: single
        options:
          - single
          - small
          - all
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read
  actions: read

concurrency:
  # Coverage labels supersede active CI just like a new commit. Other labels
  # get separate groups so their skipped runs cannot cancel active benchmarks.
  group: >-
    ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ !contains(fromJSON('["ci:single-model","ci:small-models","ci:all-models"]'), github.event.label.name) && github.event.label.name || '' }}
  cancel-in-progress: true

jobs:
  select_models:
    name: Select model tier
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      should_run: ${{ steps.selection.outputs.should_run }}
      model_tier: ${{ steps.selection.outputs.model_tier }}
    steps:
      - name: Checkout automation repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Select CI coverage
        id: selection
        run: python3 scripts/hrx/ci/select_models.py

  llama_cpp_linux:
    name: Linux / HRX
    needs: select_models
    if: needs.select_models.outputs.should_run == 'true'
    uses: ./.github/workflows/build_llama_cpp_linux.yml
    permissions:
      contents: read
    with:
      name: Build
      artifact_name: llama-cpp-linux-x86_64
      build_type: Release
      hrx_build_type: Release
      package_root_name: llama.cpp-install
      upload_artifact: true
      build_hrx_tests: true
      test_backend_ref: ${{ inputs.test_backend_ref || '' }}

  llama_cpp_release_bench:
    name: Linux / HRX release benchmark
    if: ${{ !inputs.test_backend_ref }}
    needs: [select_models, llama_cpp_linux]
    uses: ./.github/workflows/release_test_bench.yml
    permissions:
      contents: read
      actions: read
    with:
      name: Release benchmark
      release_artifact_name: llama-cpp-linux-x86_64
      package_root_name: llama.cpp-install
      model_tier: ${{ needs.select_models.outputs.model_tier }}
      skip_benchmarks: ${{ inputs.skip_benchmarks || '[]' }}

  hrx_tests:
    name: HRX tests ${{ inputs.test_backend_ref && '(qualification backend)' || '(normal pin)' }}
    needs: llama_cpp_linux
    uses: ./.github/workflows/test_hrx_linux.yml
    permissions:
      contents: read
