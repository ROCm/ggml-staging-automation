name: CI

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  baseline:
    uses: ./.github/workflows/build_llama_cpp_linux.yml
    with:
      name: Baseline build
      llama_cpp_commit: 58bc9faeafe5fe9debc22944ffba9dd4f7a68863
      artifact_name: pr125-baseline
      package_file_name: llama-cpp-linux-x86_64.tar.gz
      upload_artifact: true
  candidate:
    uses: ./.github/workflows/build_llama_cpp_linux.yml
    with:
      name: Rebased PR125 build
      artifact_name: pr125-candidate
      package_file_name: llama-cpp-linux-x86_64.tar.gz
      upload_artifact: true
  matched_smoke:
    needs: [baseline, candidate]
    name: Rebased PR125 versus current graph base, full smoke
    runs-on: linux-gfx1151-gpu-rocm
    timeout-minutes: 360
    steps:
      - name: Reject known faulty halobox-b13 runner
        if: ${{ contains(runner.name, 'halobox-b13') }}
        run: exit 1

      - name: Reject host with repeated baseline device initialization timeouts
        if: ${{ runner.name == 'CS-RORDMZ-DT243' }}
        run: exit 1

      - name: Checkout comparison harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Vulkan driver
        run: |
          sudo -n apt-get update
          sudo -n apt-get install -y --no-install-recommends mesa-vulkan-drivers

      - name: Checkout pinned Lemonade integration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AaronStGeorge/lemonade
          ref: a655fffbf750871793bf81fba0fd266ec5aa9d07
          path: lemonade-source
          persist-credentials: false

      - name: Download baseline source-built release
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pr125-baseline
          github-token: ${{ github.token }}
          path: matched-packages/before

      - name: Download standalone candidate source-built release
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pr125-candidate
          github-token: ${{ github.token }}
          path: matched-packages/after

      - name: Build Lemonade once for both versions
        run: |
          python3 scripts/hrx/build/build_lemonade.py \
            --source-dir "$PWD/lemonade-source" \
            --build-dir "$PWD/lemonade-source/build"

      - name: Run full smoke A-B, B-A, A-B and unchanged perplexity checks
        run: |
          python3 scripts/hrx/benchmark/run_matched_smoke.py \
            --packages-dir "$PWD/matched-packages" \
            --lemonade-build-dir "$PWD/lemonade-source/build" \
            --output-dir "$PWD/matched-results" \
            --before-commit 58bc9faeafe5fe9debc22944ffba9dd4f7a68863 \
            --after-commit e5afc249bde871ec3df535bf79cc499d759d51df \
            --hrx-system-commit 40b7cc13717d9d4c7f7eb0e6885563042153566b \
            --lemonade-commit a655fffbf750871793bf81fba0fd266ec5aa9d07 \
            --before-run-id "$GITHUB_RUN_ID" \
            --after-run-id "$GITHUB_RUN_ID"

      - name: Evaluate every model against the two-percent margin
        if: ${{ always() && hashFiles('matched-results/matched-smoke.json') != '' }}
        run: |
          python3 scripts/hrx/benchmark/report_matched_smoke.py \
            --input "$PWD/matched-results/matched-smoke.json" \
            --output-dir "$PWD/matched-results"

      - name: Publish comparison table in job summary
        if: ${{ always() && hashFiles('matched-results/report.md') != '' }}
        run: cat matched-results/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload raw comparison evidence and complete tables
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: matched-smoke-standalone-metadata-gfx1151
          path: matched-results
          if-no-files-found: warn
          retention-days: 45

      - name: Remove downloaded release archives
        if: ${{ always() }}
        run: rm -rf "$PWD/matched-packages"
