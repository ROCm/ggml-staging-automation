name: Build llama.cpp Linux

on:
  workflow_call:
    inputs:
      name:
        type: string
        default: Build
      artifact_name:
        type: string
        default: llama-cpp-linux-x86_64
      upload_artifact:
        type: boolean
        default: true
      build_type:
        type: string
        default: Release
      hrx_build_type:
        type: string
        default: Release

permissions:
  contents: read

jobs:
  build_llama_cpp_linux:
    name: ${{ inputs.name }}
    runs-on: aws-linux-scale-rocm-prod
    timeout-minutes: 90
    container:
      image: ghcr.io/rocm/therock_build_manylinux_x86_64@sha256:702a5133851e6d1daf1207d2c9fbb01c2667914a5b6dc5a01faeb3ce66ea6421
    env:
      PIP_CACHE_DIR: ${{ github.workspace }}/build/caches/pip
      CCACHE_DIR: ${{ github.workspace }}/build/caches/ccache
      VULKAN_SDK_VERSION: 1.3.296.0
      VULKAN_SDK_SHA256: 79b0a1593dadc46180526250836f3e53688a9a5fb42a0e5859eb72316dc4d53e
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Adjust git config
        run: git config --global --add safe.directory "$PWD"

      - name: Initialize submodules
        run: git submodule update --init hrx-system llama.cpp

      - name: Install Vulkan SDK build dependencies
        run: |
          set -eu
          download_dir="$PWD/build/downloads"
          sdk_root="$PWD/build/vulkan-sdk"
          archive="$download_dir/vulkansdk-linux-x86_64-${VULKAN_SDK_VERSION}.tar.xz"
          sdk="${sdk_root}/${VULKAN_SDK_VERSION}/x86_64"

          mkdir -p "$download_dir" "$sdk_root"
          if [ ! -x "$sdk/bin/glslc" ]; then
            curl -L --fail --retry 5 --retry-delay 5 \
              -A "Mozilla/5.0" \
              -o "$archive" \
              "https://sdk.lunarg.com/sdk/download/${VULKAN_SDK_VERSION}/linux/vulkansdk-linux-x86_64-${VULKAN_SDK_VERSION}.tar.xz"
            printf '%s  %s\n' "$VULKAN_SDK_SHA256" "$archive" | sha256sum --check -
            tar -xJf "$archive" -C "$sdk_root"
          fi

          test -x "$sdk/bin/glslc"
          test -f "$sdk/include/vulkan/vulkan.h"
          test -e "$sdk/lib/libvulkan.so"
          "$sdk/bin/glslc" --version

          echo "$sdk/bin" >> "$GITHUB_PATH"
          echo "VULKAN_SDK=$sdk" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=$sdk${CMAKE_PREFIX_PATH:+:$CMAKE_PREFIX_PATH}" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$sdk/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Install Python dependencies
        run: python3 -m pip install --upgrade -r requirements.txt cmake==3.31.6

      - name: Build and validate llama.cpp
        run: |
          python3 scripts/hrx/build_all.py \
            --build-type "${{ inputs.build_type }}" \
            --hrx-build-type "${{ inputs.hrx_build_type }}"

      - name: Upload llama.cpp install tree
        if: ${{ inputs.upload_artifact }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact_name }}
          path: build/llama.cpp-install
          if-no-files-found: error
