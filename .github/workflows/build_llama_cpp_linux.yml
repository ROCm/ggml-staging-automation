name: Build llama.cpp Linux

on:
  workflow_call:
    inputs:
      name:
        type: string
        default: Build
      artifact_name:
        type: string
        default: llama-cpp-linux-x86_64
      upload_artifact:
        type: boolean
        default: true
      build_type:
        type: string
        default: Release
      hrx_build_type:
        type: string
        default: Release
      package_file_name:
        type: string
        default: ""
      package_root_name:
        type: string
        default: llama.cpp-install

jobs:
  build_llama_cpp_linux:
    name: ${{ inputs.name }}
    runs-on: aws-linux-scale-rocm-prod
    timeout-minutes: 90
    container:
      image: ghcr.io/rocm/therock_build_manylinux_x86_64@sha256:702a5133851e6d1daf1207d2c9fbb01c2667914a5b6dc5a01faeb3ce66ea6421
    env:
      PIP_CACHE_DIR: ${{ github.workspace }}/build/caches/pip
      CCACHE_DIR: ${{ github.workspace }}/build/caches/ccache
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Adjust git config
        run: git config --global --add safe.directory "$PWD"

      - name: Initialize submodules
        run: git submodule update --init hrx-system llama.cpp

      - name: Install Python dependencies
        run: python3 -m pip install --upgrade -r requirements.txt cmake==3.31.6 ninja

      - name: Build Vulkan SDK build dependencies
        run: |
          set -eu
          python3 scripts/hrx/build_vulkan_sdk.py
          vulkan_sdk="$PWD/build/vulkan-sdk"
          echo "$vulkan_sdk/bin" >> "$GITHUB_PATH"
          echo "VULKAN_SDK=$vulkan_sdk" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=$vulkan_sdk${CMAKE_PREFIX_PATH:+:$CMAKE_PREFIX_PATH}" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$vulkan_sdk/lib:$vulkan_sdk/lib64${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Build and validate llama.cpp
        run: |
          python3 scripts/hrx/build_all.py \
            --build-type "${{ inputs.build_type }}" \
            --hrx-build-type "${{ inputs.hrx_build_type }}"

      - name: Package llama.cpp install tree
        if: ${{ inputs.upload_artifact }}
        env:
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
          PACKAGE_FILE_NAME: ${{ inputs.package_file_name }}
          PACKAGE_ROOT_NAME: ${{ inputs.package_root_name }}
        run: |
          set -eu
          package_file_name="${PACKAGE_FILE_NAME:-${ARTIFACT_NAME}.tar.gz}"
          package_dir="$PWD/build/artifacts"
          package_root="$package_dir/$PACKAGE_ROOT_NAME"

          rm -rf "$package_dir"
          mkdir -p "$package_root"
          cp -a "$PWD/build/llama.cpp-install/." "$package_root/"
          cp "$PWD/LICENSE" "$package_root/LICENSE"
          cp "$PWD/README.md" "$package_root/README.md"
          tar -czf "$package_dir/$package_file_name" -C "$package_dir" "$PACKAGE_ROOT_NAME"

      - name: Upload llama.cpp install tree
        if: ${{ inputs.upload_artifact }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact_name }}
          path: build/artifacts/*.tar.gz
          if-no-files-found: error
