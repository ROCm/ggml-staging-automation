name: Build llama.cpp Linux

on:
  workflow_call:
    inputs:
      name:
        type: string
        default: Build
      artifact_name:
        type: string
        default: llama-cpp-linux-x86_64
      upload_artifact:
        type: boolean
        default: true
      build_type:
        type: string
        default: Release
      hrx_build_type:
        type: string
        default: Release
      package_file_name:
        type: string
        default: ""
      package_root_name:
        type: string
        default: llama.cpp-install
      build_test_package:
        type: boolean
        default: false
      test_artifact_name:
        type: string
        default: llama-cpp-linux-x86_64-tests

permissions:
  contents: read

jobs:
  build_llama_cpp_linux:
    name: ${{ inputs.name }}
    runs-on: aws-linux-scale-rocm-prod
    timeout-minutes: 90
    container:
      image: quay.io/pypa/manylinux_2_34_x86_64@sha256:d53167459147625634b49200f780617700ade2a8d64934a3b3a3b07ac840593d
    env:
      PIP_CACHE_DIR: ${{ github.workspace }}/build/caches/pip
      CCACHE_DIR: ${{ github.workspace }}/build/caches/ccache
      CPLUS_INCLUDE_PATH: /opt/rh/gcc-toolset-14/root/usr/include/c++/14:/opt/rh/gcc-toolset-14/root/usr/include/c++/14/x86_64-redhat-linux:/opt/rh/gcc-toolset-14/root/usr/include/c++/14/backward
      LIBRARY_PATH: /opt/rh/gcc-toolset-14/root/usr/lib/gcc/x86_64-redhat-linux/14:/opt/rh/gcc-toolset-14/root/usr/lib64:/opt/rh/gcc-toolset-14/root/usr/lib
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Adjust git config
        run: git config --global --add safe.directory "$PWD"

      - name: Initialize submodules
        run: git submodule update --init hrx-system llama.cpp

      - name: Select Python 3.12
        run: echo "/opt/python/cp312-cp312/bin" >> "$GITHUB_PATH"

      - name: Install Python dependencies
        run: python3 -m pip install --upgrade -r requirements.txt cmake==3.31.6 ninja meson mako packaging pyyaml

      - name: Install Mesa build dependencies
        run: dnf install -y bison flex zlib-devel expat-devel

      - name: Build Vulkan SDK build dependencies
        run: python3 scripts/hrx/build_vulkan_sdk.py --vulkan-sdk-dir "$PWD/build/vulkan-sdk"

      - name: Build and validate llama.cpp
        env:
          BUILD_TEST_PACKAGE: ${{ inputs.build_test_package }}
          BUILD_TYPE: ${{ inputs.build_type }}
          HRX_BUILD_TYPE: ${{ inputs.hrx_build_type }}
        run: |
          test_package_args=()
          if [ "$BUILD_TEST_PACKAGE" = "true" ]; then
            test_package_args=(
              --build-test-package
            )
          fi
          python3 scripts/hrx/build_all.py \
            --build-type "$BUILD_TYPE" \
            --hrx-build-type "$HRX_BUILD_TYPE" \
            --vulkan-sdk-dir "$PWD/build/vulkan-sdk" \
            "${test_package_args[@]}"

      - name: Package llama.cpp artifacts
        if: ${{ inputs.upload_artifact || inputs.build_test_package }}
        env:
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
          BUILD_TEST_PACKAGE: ${{ inputs.build_test_package }}
          PACKAGE_FILE_NAME: ${{ inputs.package_file_name }}
          PACKAGE_ROOT_NAME: ${{ inputs.package_root_name }}
          TEST_ARTIFACT_NAME: ${{ inputs.test_artifact_name }}
        run: |
          set -eu
          package_file_name="${PACKAGE_FILE_NAME:-${ARTIFACT_NAME}.tar.gz}"
          package_dir="$PWD/build/artifacts"
          rm -rf "$package_dir"

          test_package_args=()
          if [ "$BUILD_TEST_PACKAGE" = "true" ]; then
            test_package_args=(
              --test-package-file "$package_dir/${TEST_ARTIFACT_NAME}.tar.gz"
            )
          fi

          python3 scripts/hrx/build_artifacts_from_llama_cpp_install.py \
            --llama-install-dir "$PWD/build/llama.cpp-install" \
            --release-package-file "$package_dir/$package_file_name" \
            --package-root-name "$PACKAGE_ROOT_NAME" \
            "${test_package_args[@]}"

      - name: Upload llama.cpp install tree
        if: ${{ inputs.upload_artifact }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact_name }}
          path: build/artifacts/${{ inputs.package_file_name || format('{0}.tar.gz', inputs.artifact_name) }}
          if-no-files-found: error

      - name: Upload llama.cpp test package
        if: ${{ inputs.upload_artifact && inputs.build_test_package }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.test_artifact_name }}
          path: build/artifacts/${{ inputs.test_artifact_name }}.tar.gz
          if-no-files-found: error
          retention-days: 1
