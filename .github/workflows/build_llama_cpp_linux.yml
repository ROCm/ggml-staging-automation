name: Build llama.cpp Linux

on:
  workflow_call:
    inputs:
      name:
        type: string
        default: Build
      artifact_name:
        type: string
        default: llama-cpp-linux-x86_64
      upload_artifact:
        type: boolean
        default: true
      build_type:
        type: string
        default: Release
      hrx_build_type:
        type: string
        default: Release
      package_file_name:
        type: string
        default: ""
      package_root_name:
        type: string
        default: llama.cpp-install
      build_test_package:
        type: boolean
        default: false
      test_artifact_name:
        type: string
        default: llama-cpp-linux-x86_64-tests

jobs:
  build_llama_cpp_linux:
    name: ${{ inputs.name }}
    runs-on: aws-linux-scale-rocm-prod
    timeout-minutes: 90
    container:
      image: ghcr.io/rocm/therock_build_manylinux_x86_64@sha256:702a5133851e6d1daf1207d2c9fbb01c2667914a5b6dc5a01faeb3ce66ea6421
    env:
      PIP_CACHE_DIR: ${{ github.workspace }}/build/caches/pip
      CCACHE_DIR: ${{ github.workspace }}/build/caches/ccache
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Adjust git config
        run: git config --global --add safe.directory "$PWD"

      - name: Initialize submodules
        run: git submodule update --init hrx-system llama.cpp

      - name: Install Python dependencies
        run: python3 -m pip install --upgrade -r requirements.txt cmake==3.31.6 ninja

      - name: Build Vulkan SDK build dependencies
        run: python3 scripts/hrx/build_vulkan_sdk.py --vulkan-sdk-dir "$PWD/build/vulkan-sdk"

      - name: Build and validate llama.cpp
        run: |
          test_package_args=()
          if [ "${{ inputs.build_test_package }}" = "true" ]; then
            test_package_args=(
              --build-test-package
            )
          fi
          python3 scripts/hrx/build_all.py \
            --build-type "${{ inputs.build_type }}" \
            --hrx-build-type "${{ inputs.hrx_build_type }}" \
            --vulkan-sdk-dir "$PWD/build/vulkan-sdk" \
            "${test_package_args[@]}"

      - name: Package llama.cpp artifacts
        if: ${{ inputs.upload_artifact || inputs.build_test_package }}
        env:
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
          BUILD_TEST_PACKAGE: ${{ inputs.build_test_package }}
          PACKAGE_FILE_NAME: ${{ inputs.package_file_name }}
          PACKAGE_ROOT_NAME: ${{ inputs.package_root_name }}
          TEST_ARTIFACT_NAME: ${{ inputs.test_artifact_name }}
        run: |
          set -eu
          package_file_name="${PACKAGE_FILE_NAME:-${ARTIFACT_NAME}.tar.gz}"
          package_dir="$PWD/build/artifacts"
          rm -rf "$package_dir"

          test_package_args=()
          if [ "$BUILD_TEST_PACKAGE" = "true" ]; then
            test_package_args=(
              --test-package-file "$package_dir/${TEST_ARTIFACT_NAME}.tar.gz"
            )
          fi

          python3 scripts/hrx/build_artifacts_from_llama_cpp_install.py \
            --llama-install-dir "$PWD/build/llama.cpp-install" \
            --release-package-file "$package_dir/$package_file_name" \
            --package-root-name "$PACKAGE_ROOT_NAME" \
            "${test_package_args[@]}"

      - name: Upload llama.cpp install tree
        if: ${{ inputs.upload_artifact }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact_name }}
          path: build/artifacts/${{ inputs.package_file_name || format('{0}.tar.gz', inputs.artifact_name) }}
          if-no-files-found: error

      - name: Upload llama.cpp test package
        if: ${{ inputs.upload_artifact && inputs.build_test_package }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.test_artifact_name }}
          path: build/artifacts/${{ inputs.test_artifact_name }}.tar.gz
          if-no-files-found: error
          retention-days: 1
