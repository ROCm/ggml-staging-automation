name: PR 108 canary GPU discovery

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  devices:
    runs-on: linux-gfx1151-gpu-rocm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Vulkan driver
        run: |
          sudo -n apt-get update
          sudo -n apt-get install -y --no-install-recommends mesa-vulkan-drivers
      - name: Set up GPU device groups
        # Temporary workaround for canary containers missing host GPU groups.
        run: |
          for gid in $(stat -c %g /dev/kfd /dev/dri/renderD* | sort -u); do
            getent group "$gid" >/dev/null || sudo -n groupadd -g "$gid" "ci-gpu-$gid"
            sudo -n usermod -aG "$gid" "$(id -un)"
          done
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: llama-cpp-linux-x86_64
          path: build/canary-artifact
          run-id: '39616913301'
          github-token: ${{ github.token }}
      - name: Extract and inspect exact PR package
        run: |
          python3 scripts/hrx/package/extract_release_package.py \
            --archive build/canary-artifact/llama-cpp-linux-x86_64.tar.gz \
            --package-root-name llama.cpp-install --output-dir build/canary-package
          sudo -n -E -u "$(id -un)" -- python3 scripts/hrx/benchmark/diagnose_pr108_canary.py \
            --package build/canary-package --output build/canary-results
          grep -q 'HRX0:' build/canary-results/devices-inherited.log
          grep -q 'Vulkan0:' build/canary-results/devices-inherited.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: pr108-canary-devices
          path: build/canary-results/
      - name: Remove diagnostic packages
        if: always()
        run: rm -rf build/canary-artifact build/canary-package
