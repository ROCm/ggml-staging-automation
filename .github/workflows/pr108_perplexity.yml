name: PR 108 focused perplexity

on:
  push:
    branches: [users/astgeorg/pr108-perplexity-runners]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    uses: ./.github/workflows/build_llama_cpp_linux.yml
    with:
      name: Build publication fix
      artifact_name: pr108-fixed-linux-x86_64

  perplexity:
    name: Llama-3.2-1B / gfx1151 / runner ${{ matrix.replica }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2, 3, 4]
    runs-on: linux-gfx1151-gpu-rocm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Vulkan driver
        run: |
          sudo -n apt-get update
          sudo -n apt-get install -y --no-install-recommends mesa-vulkan-drivers

      - name: Download fixed package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pr108-fixed-linux-x86_64
          path: build/pr108-artifacts/fixed

      - name: Download original PR 108 package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: llama-cpp-linux-x86_64
          path: build/pr108-artifacts/original
          run-id: '39413873090'
          github-token: ${{ github.token }}

      - name: Extract packages
        run: |
          python3 scripts/hrx/package/extract_release_package.py \
            --archive build/pr108-artifacts/fixed/pr108-fixed-linux-x86_64.tar.gz \
            --package-root-name llama.cpp-install --output-dir build/pr108-fixed
          python3 scripts/hrx/package/extract_release_package.py \
            --archive build/pr108-artifacts/original/llama-cpp-linux-x86_64.tar.gz \
            --package-root-name llama.cpp-install --output-dir build/pr108-original

      - name: Repeat single-model perplexity
        run: |
          python3 scripts/hrx/benchmark/run_pr108_perplexity.py \
            --original-package build/pr108-original --fixed-package build/pr108-fixed \
            --output-dir build/pr108-results --repetitions 5

      - name: Upload measurements and runner identity
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr108-perplexity-runner-${{ matrix.replica }}
          path: build/pr108-results/
          if-no-files-found: warn

      - name: Remove packages from self-hosted runner
        if: always()
        run: rm -rf build/pr108-artifacts build/pr108-fixed build/pr108-original
