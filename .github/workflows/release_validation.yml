name: Validate llama.cpp Release Linux

on:
  workflow_call:
    inputs:
      validation_mode:
        description: tests-and-gguf-qualification, tests-only, or gguf-qualification-only.
        type: string
        default: tests-and-gguf-qualification
      include_workloads:
        description: 'JSON GGUF qualification workload IDs to run, e.g. ["long-context-benchmark"].'
        type: string
        default: '["lemonade-benchmark","perplexity"]'
      name:
        type: string
        default: Release tests
      release_artifact_name:
        type: string
        required: true
      package_root_name:
        type: string
        default: llama.cpp-install
      # Selected models are pulled from Hugging Face.
      model_ids:
        description: JSON array of exact model IDs; overrides model_tier when non-empty.
        type: string
        default: '[]'
      model_tier:
        description: Cumulative model manifest tier to run.
        type: string
        required: true
      allow_failure:
        description: Allow release validation jobs to fail without failing the calling workflow.
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  gguf_qualification_llama_cpp_release_linux:
    name: ${{ inputs.name }} (${{ matrix.gpu_target }})
    continue-on-error: ${{ inputs.allow_failure }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - gpu_target: gfx1151
            runs_on: linux-gfx1151-gpu-rocm
          # - gpu_target: gfx1201
          #   runs_on: linux-gfx120X-gpu-rocm
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 360
    env:
      GGUF_QUALIFICATION_ARTIFACT_NAME: gguf-qualification-${{ matrix.gpu_target }}
      GGUF_QUALIFICATION_STATE_NAME: gguf-qualification-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.gpu_target }}
    steps:
      - name: Checkout automation repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download llama.cpp release package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.release_artifact_name }}
          path: artifacts

      - name: Extract release package
        env:
          PACKAGE_ROOT_NAME: ${{ inputs.package_root_name }}
          RELEASE_ARTIFACT_NAME: ${{ inputs.release_artifact_name }}
        run: |
          python3 scripts/hrx/package/extract_release_package.py \
            --archive "artifacts/${RELEASE_ARTIFACT_NAME}.tar.gz" \
            --package-root-name "$PACKAGE_ROOT_NAME" \
            --output-dir release/validation-package

      - name: Install CTest
        if: inputs.validation_mode != 'gguf-qualification-only'
        run: |
          sudo -n apt-get update
          sudo -n apt-get install -y --no-install-recommends cmake

      - name: Download HRX test package
        if: inputs.validation_mode != 'gguf-qualification-only'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hrx-tests
          path: artifacts

      - name: Extract HRX test package
        if: inputs.validation_mode != 'gguf-qualification-only'
        run: |
          python3 scripts/hrx/package/extract_release_package.py \
            --archive artifacts/hrx-tests.tar.gz \
            --package-root-name hrx-tests \
            --output-dir release/hrx-tests

      - name: Run packaged HRX suites
        id: hrx_tests
        if: inputs.validation_mode != 'gguf-qualification-only'
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/release/validation-package/lib
        run: |
          ctest --test-dir release/hrx-tests --parallel 2 --verbose \
            --output-junit "$PWD/release/hrx-tests/junit.xml"

      - name: Upload HRX test results
        if: ${{ always() && (steps.hrx_tests.outcome == 'success' || steps.hrx_tests.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hrx-test-results-${{ matrix.gpu_target }}
          path: |
            release/hrx-tests/metadata.json
            release/hrx-tests/junit.xml
            release/hrx-tests/Testing/
          if-no-files-found: error
          retention-days: 45

      - name: Install Vulkan driver
        if: inputs.validation_mode != 'tests-only'
        # llama.cpp bundles the Vulkan loader but discovers the GPU through
        # the host ICD, so the runner must provide one.
        run: |
          sudo -n apt-get update
          sudo -n apt-get install -y --no-install-recommends mesa-vulkan-drivers

      - name: Record source commits
        if: inputs.validation_mode != 'tests-only'
        id: sources
        run: |
          set -euo pipefail
          llama_cpp=$(git rev-parse HEAD:llama.cpp)
          hrx_system=$(git rev-parse HEAD:hrx-system)
          echo "llama_cpp=$llama_cpp" >> "$GITHUB_OUTPUT"
          echo "hrx_system=$hrx_system" >> "$GITHUB_OUTPUT"

      - name: Install pinned Lemonade release
        if: ${{ inputs.validation_mode != 'tests-only' && contains(fromJSON(inputs.include_workloads), 'lemonade-benchmark') }}
        run: |
          python3 scripts/hrx/package/fetch_lemonade.py \
            --pin gguf_qualification/hrx/lemonade_release.json \
            --output-dir release/lemonade

      - name: Write GGUF qualification metadata
        if: inputs.validation_mode != 'tests-only'
        env:
          HRX_SYSTEM_COMMIT: ${{ steps.sources.outputs.hrx_system }}
          LLAMA_CPP_COMMIT: ${{ steps.sources.outputs.llama_cpp }}
        run: |
          python3 scripts/hrx/gguf_qualification/write_qualification_metadata.py \
            --output "$PWD/gguf-qualification/metadata.json" \
            --llama-cpp-commit "$LLAMA_CPP_COMMIT" \
            --hrx-system-commit "$HRX_SYSTEM_COMMIT" \
            --lemonade-release gguf_qualification/hrx/lemonade_release.json

      - name: Fetch perplexity corpus
        if: ${{ inputs.validation_mode != 'tests-only' && contains(fromJSON(inputs.include_workloads), 'perplexity') }}
        run: |
          python3 scripts/hrx/gguf_qualification/fetch_wikitext2.py \
            --output-dir "$PWD/perplexity-corpus"

      - name: Run HRX and Vulkan GGUF qualification
        if: inputs.validation_mode != 'tests-only'
        id: gguf_qualification
        continue-on-error: true
        env:
          INCLUDE_WORKLOADS: ${{ inputs.include_workloads }}
          QUALIFICATION_MODEL_IDS: ${{ inputs.model_ids }}
          QUALIFICATION_MODEL_TIER: ${{ inputs.model_tier }}
        run: |
          set -euo pipefail
          python3 scripts/hrx/gguf_qualification/run_gguf_qualification.py \
            --qualification-spec "$PWD/gguf_qualification/hrx/qualification_spec.json" \
            --model-manifest "$PWD/gguf_qualification/hrx/model_manifest.json" \
            --include-workloads "$INCLUDE_WORKLOADS" \
            --model-tier "$QUALIFICATION_MODEL_TIER" \
            --model-ids "$QUALIFICATION_MODEL_IDS" \
            --work-root "$RUNNER_TEMP/$GGUF_QUALIFICATION_STATE_NAME" \
            --max-disk-gib 60

      - name: Remove perplexity corpus
        # The runners are self-hosted, so GGUF qualification inputs are removed explicitly.
        if: ${{ always() && inputs.validation_mode != 'tests-only' }}
        run: |
          rm -rf "$PWD/perplexity-corpus"

      - name: Write Lemonade benchmark report
        if: ${{ inputs.validation_mode != 'tests-only' && contains(fromJSON(inputs.include_workloads), 'lemonade-benchmark') }}
        run: |
          python3 scripts/hrx/gguf_qualification/write_lemonade_benchmark_report.py \
            "$PWD/gguf-qualification/benchmark-hrx.json" \
            "$PWD/gguf-qualification/benchmark-vulkan.json" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Write perplexity report
        if: ${{ inputs.validation_mode != 'tests-only' && contains(fromJSON(inputs.include_workloads), 'perplexity') }}
        run: |
          python3 scripts/hrx/gguf_qualification/write_perplexity_report.py \
            "$PWD/gguf-qualification/perplexity.json" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Write long-context benchmark report
        if: ${{ inputs.validation_mode != 'tests-only' && contains(fromJSON(inputs.include_workloads), 'long-context-benchmark') }}
        run: |
          python3 scripts/hrx/gguf_qualification/write_context_sweep_report.py \
            "$PWD/gguf-qualification/long-context-benchmark.json" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Upload GGUF qualification results
        if: ${{ always() && (steps.gguf_qualification.outcome == 'success' || steps.gguf_qualification.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.GGUF_QUALIFICATION_ARTIFACT_NAME }}
          path: |
            gguf-qualification/benchmark-hrx.json
            gguf-qualification/benchmark-vulkan.json
            gguf-qualification/perplexity.json
            gguf-qualification/long-context-benchmark.json
            gguf-qualification/metadata.json
          if-no-files-found: error
          retention-days: 45

      - name: Upload GGUF qualification debug logs
        # Preserve diagnostics when GGUF qualification or report steps fail.
        if: ${{ always() && (steps.gguf_qualification.outcome == 'success' || steps.gguf_qualification.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gguf-qualification-debug-log-${{ matrix.gpu_target }}
          path: |
            gguf-qualification-debug/lemond-hrx.log
            gguf-qualification-debug/lemond-vulkan.log
            gguf-qualification-debug/responses-hrx.jsonl
            gguf-qualification-debug/responses-vulkan.jsonl
            gguf-qualification-debug/perplexity-hrx.log
            gguf-qualification-debug/perplexity-vulkan.log
            gguf-qualification-debug/long-context-benchmark-hrx.log
            gguf-qualification-debug/long-context-benchmark-vulkan.log
          if-no-files-found: warn

      - name: Fail unexpected GGUF qualification results
        if: ${{ always() && steps.gguf_qualification.outcome == 'failure' }}
        run: |
          echo "One or more GGUF qualification batches had unexpected failures or XPASS results." >&2
          exit 1
