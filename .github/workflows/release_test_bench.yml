name: Validate llama.cpp Release Linux

on:
  workflow_call:
    inputs:
      validation_mode:
        description: tests-and-benchmarks, tests-only, or benchmarks-only.
        type: string
        default: tests-and-benchmarks
      skip_benchmarks:
        description: 'JSON list of benchmark IDs to skip, e.g. ["lemonade-benchmark"] or ["perplexity"].'
        type: string
        default: '[]'
      name:
        type: string
        default: Release tests
      release_artifact_name:
        type: string
        required: true
      package_root_name:
        type: string
        default: llama.cpp-install
      # WARNING: All models selected by this tier are pulled from Hugging Face.
      model_tier:
        description: Cumulative model manifest tier to benchmark.
        type: string
        required: true
      allow_failure:
        description: Allow release validation jobs to fail without failing the calling workflow.
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  benchmark_llama_cpp_release_linux:
    name: ${{ inputs.name }} (${{ matrix.gpu_target }})
    continue-on-error: ${{ inputs.allow_failure }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - gpu_target: gfx1151
            runs_on: linux-gfx1151-gpu-rocm
          # - gpu_target: gfx1201
          #   runs_on: linux-gfx120X-gpu-rocm
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 360
    env:
      BENCHMARK_ARTIFACT_NAME: lemonade-bench-${{ matrix.gpu_target }}
      BENCHMARK_STATE_NAME: lemonade-bench-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.gpu_target }}
    steps:
      - name: Checkout automation repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download llama.cpp release package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.release_artifact_name }}
          path: artifacts

      - name: Extract release package
        env:
          PACKAGE_ROOT_NAME: ${{ inputs.package_root_name }}
          RELEASE_ARTIFACT_NAME: ${{ inputs.release_artifact_name }}
        run: |
          python3 scripts/hrx/package/extract_release_package.py \
            --archive "artifacts/${RELEASE_ARTIFACT_NAME}.tar.gz" \
            --package-root-name "$PACKAGE_ROOT_NAME" \
            --output-dir release/benchmark-package

      - name: Install CTest
        if: inputs.validation_mode != 'benchmarks-only'
        run: |
          sudo -n apt-get update
          sudo -n apt-get install -y --no-install-recommends cmake

      - name: Download HRX test package
        if: inputs.validation_mode != 'benchmarks-only'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hrx-tests
          path: artifacts

      - name: Extract HRX test package
        if: inputs.validation_mode != 'benchmarks-only'
        run: |
          python3 scripts/hrx/package/extract_release_package.py \
            --archive artifacts/hrx-tests.tar.gz \
            --package-root-name hrx-tests \
            --output-dir release/hrx-tests

      - name: Run packaged HRX suites
        id: hrx_tests
        if: inputs.validation_mode != 'benchmarks-only'
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/release/benchmark-package/lib
        run: |
          ctest --test-dir release/hrx-tests --parallel 2 --verbose \
            --output-junit "$PWD/release/hrx-tests/junit.xml"

      - name: Upload HRX test results
        if: ${{ always() && (steps.hrx_tests.outcome == 'success' || steps.hrx_tests.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hrx-test-results-${{ matrix.gpu_target }}
          path: |
            release/hrx-tests/metadata.json
            release/hrx-tests/junit.xml
            release/hrx-tests/Testing/
          if-no-files-found: error
          retention-days: 45

      - name: Install Vulkan driver
        if: inputs.validation_mode != 'tests-only'
        # llama.cpp bundles the Vulkan loader but discovers the GPU through
        # the host ICD, so the runner must provide one.
        run: |
          sudo -n apt-get update
          sudo -n apt-get install -y --no-install-recommends mesa-vulkan-drivers

      - name: Record source commits
        if: inputs.validation_mode != 'tests-only'
        id: sources
        run: |
          set -euo pipefail
          llama_cpp=$(git rev-parse HEAD:llama.cpp)
          hrx_system=$(git rev-parse HEAD:hrx-system)
          echo "llama_cpp=$llama_cpp" >> "$GITHUB_OUTPUT"
          echo "hrx_system=$hrx_system" >> "$GITHUB_OUTPUT"

      - name: Install pinned Lemonade release
        if: ${{ inputs.validation_mode != 'tests-only' && !contains(fromJSON(inputs.skip_benchmarks), 'lemonade-benchmark') }}
        run: |
          python3 scripts/hrx/package/fetch_lemonade.py \
            --pin benchmarks/hrx/lemonade_release.json \
            --output-dir release/lemonade

      - name: Write benchmark metadata
        if: inputs.validation_mode != 'tests-only'
        env:
          HRX_SYSTEM_COMMIT: ${{ steps.sources.outputs.hrx_system }}
          LLAMA_CPP_COMMIT: ${{ steps.sources.outputs.llama_cpp }}
        run: |
          python3 scripts/hrx/benchmark/write_benchmark_metadata.py \
            --output "$PWD/lemonade-benchmark/metadata.json" \
            --llama-cpp-commit "$LLAMA_CPP_COMMIT" \
            --hrx-system-commit "$HRX_SYSTEM_COMMIT" \
            --lemonade-release benchmarks/hrx/lemonade_release.json

      - name: Fetch perplexity corpus
        if: ${{ inputs.validation_mode != 'tests-only' && !contains(fromJSON(inputs.skip_benchmarks), 'perplexity') }}
        run: |
          python3 scripts/hrx/benchmark/fetch_wikitext2.py \
            --output-dir "$PWD/perplexity-corpus"

      - name: Run batched HRX and Vulkan benchmarks
        if: inputs.validation_mode != 'tests-only'
        id: benchmark
        continue-on-error: true
        env:
          SKIP_BENCHMARKS: ${{ inputs.skip_benchmarks }}
          BENCHMARK_MODEL_TIER: ${{ inputs.model_tier }}
        run: |
          set -euo pipefail
          python3 scripts/hrx/benchmark/run_batched_benchmark.py \
            --benchmark-spec "$PWD/benchmarks/hrx/benchmark_spec.json" \
            --model-manifest "$PWD/benchmarks/hrx/model_manifest.json" \
            --skip-benchmarks "$SKIP_BENCHMARKS" \
            --model-tier "$BENCHMARK_MODEL_TIER" \
            --work-root "$RUNNER_TEMP/$BENCHMARK_STATE_NAME" \
            --max-disk-gib 40

      - name: Remove perplexity corpus
        # The runners are self-hosted, so benchmark inputs are removed explicitly.
        if: ${{ always() && inputs.validation_mode != 'tests-only' }}
        run: |
          rm -rf "$PWD/perplexity-corpus"

      - name: Write Lemonade benchmark report
        if: ${{ inputs.validation_mode != 'tests-only' && !contains(fromJSON(inputs.skip_benchmarks), 'lemonade-benchmark') }}
        run: |
          python3 scripts/hrx/benchmark/write_lemonade_benchmark_report.py \
            "$PWD/lemonade-benchmark/benchmark-hrx.json" \
            "$PWD/lemonade-benchmark/benchmark-vulkan.json" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Write perplexity report
        if: ${{ inputs.validation_mode != 'tests-only' && !contains(fromJSON(inputs.skip_benchmarks), 'perplexity') }}
        run: |
          python3 scripts/hrx/benchmark/write_perplexity_report.py \
            "$PWD/lemonade-benchmark/perplexity.json" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark results
        if: ${{ always() && (steps.benchmark.outcome == 'success' || steps.benchmark.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.BENCHMARK_ARTIFACT_NAME }}
          path: |
            lemonade-benchmark/benchmark-hrx.json
            lemonade-benchmark/benchmark-vulkan.json
            lemonade-benchmark/perplexity.json
            lemonade-benchmark/metadata.json
          if-no-files-found: error
          retention-days: 45

      - name: Upload benchmark debug logs
        # Preserve diagnostics when the benchmark or report step fails.
        if: ${{ always() && (steps.benchmark.outcome == 'success' || steps.benchmark.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lemonade-bench-debug-log-${{ matrix.gpu_target }}
          path: |
            lemonade-benchmark-debug/lemond-hrx.log
            lemonade-benchmark-debug/lemond-vulkan.log
            lemonade-benchmark-debug/responses-hrx.jsonl
            lemonade-benchmark-debug/responses-vulkan.jsonl
            lemonade-benchmark-debug/perplexity-hrx.log
            lemonade-benchmark-debug/perplexity-vulkan.log
          if-no-files-found: warn

      - name: Fail unexpected benchmark results
        if: ${{ always() && steps.benchmark.outcome == 'failure' }}
        run: |
          echo "One or more benchmark batches had unexpected failures or XPASS results." >&2
          exit 1
