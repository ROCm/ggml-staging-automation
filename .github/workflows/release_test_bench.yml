name: Benchmark llama.cpp Release Linux

on:
  workflow_call:
    inputs:
      name:
        type: string
        default: Release tests
      release_artifact_name:
        type: string
        required: true
      package_root_name:
        type: string
        default: llama.cpp-install
      # WARNING: All models listed here will be pulled from Hugging Face during the benchmark.
      models:
        description: Space-separated model manifest IDs to benchmark.
        type: string
        default: qwen3-30b-a3b-instruct-2507
      allow_failure:
        description: Allow release validation jobs to fail without failing the calling workflow.
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  benchmark_llama_cpp_release_linux:
    name: ${{ inputs.name }} (${{ matrix.gpu_target }})
    continue-on-error: ${{ inputs.allow_failure }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - gpu_target: gfx1151
            runs_on: linux-gfx1151-gpu-rocm
          # - gpu_target: gfx1201
          #   runs_on: linux-gfx120X-gpu-rocm
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 360
    env:
      BENCHMARK_ARTIFACT_NAME: lemonade-bench-${{ matrix.gpu_target }}
      BENCHMARK_STATE_NAME: lemonade-bench-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.gpu_target }}
    steps:
      - name: Install Vulkan driver
        # llama.cpp bundles the Vulkan loader but discovers the GPU through
        # the host ICD, so the runner must provide one.
        run: |
          sudo -n apt-get update
          sudo -n apt-get install -y --no-install-recommends mesa-vulkan-drivers

      - name: Checkout automation repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout Lemonade HRX integration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AaronStGeorge/lemonade
          ref: hrx-integration
          path: lemonade-source
          persist-credentials: false

      - name: Record source commits
        id: sources
        run: |
          set -euo pipefail
          llama_cpp=$(git rev-parse HEAD:llama.cpp)
          hrx_system=$(git rev-parse HEAD:hrx-system)
          lemonade=$(git -C lemonade-source rev-parse HEAD)
          echo "llama_cpp=$llama_cpp" >> "$GITHUB_OUTPUT"
          echo "hrx_system=$hrx_system" >> "$GITHUB_OUTPUT"
          echo "lemonade=$lemonade" >> "$GITHUB_OUTPUT"

      - name: Download llama.cpp release package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.release_artifact_name }}
          path: artifacts

      - name: Extract release package
        env:
          PACKAGE_ROOT_NAME: ${{ inputs.package_root_name }}
          RELEASE_ARTIFACT_NAME: ${{ inputs.release_artifact_name }}
        run: |
          python3 scripts/hrx/extract_release_package.py \
            --archive "artifacts/${RELEASE_ARTIFACT_NAME}.tar.gz" \
            --package-root-name "$PACKAGE_ROOT_NAME" \
            --output-dir release/benchmark-package

      - name: Build Lemonade
        run: |
          python3 scripts/hrx/build_lemonade.py \
            --source-dir "$PWD/lemonade-source" \
            --build-dir "$PWD/lemonade-source/build"

      - name: Write benchmark metadata
        env:
          HRX_SYSTEM_COMMIT: ${{ steps.sources.outputs.hrx_system }}
          LEMONADE_COMMIT: ${{ steps.sources.outputs.lemonade }}
          LLAMA_CPP_COMMIT: ${{ steps.sources.outputs.llama_cpp }}
        run: |
          python3 scripts/hrx/write_benchmark_metadata.py \
            --output "$PWD/lemonade-benchmark/metadata.json" \
            --llama-cpp-commit "$LLAMA_CPP_COMMIT" \
            --hrx-system-commit "$HRX_SYSTEM_COMMIT" \
            --lemonade-commit "$LEMONADE_COMMIT"

      - name: Fetch perplexity corpus
        run: |
          python3 scripts/hrx/fetch_wikitext2.py \
            --output-dir "$PWD/perplexity-corpus"

      - name: Run batched HRX and Vulkan benchmarks
        id: benchmark
        continue-on-error: true
        env:
          BENCHMARK_MODELS: ${{ inputs.models }}
        run: |
          set -euo pipefail
          read -r -a models <<< "$BENCHMARK_MODELS"
          python3 scripts/hrx/run_batched_benchmark.py \
            --benchmark-spec "$PWD/scripts/hrx/benchmark_spec.json" \
            --model-manifest "$PWD/scripts/hrx/lemonade_model_manifest.json" \
            --models "${models[@]}" \
            --work-root "$RUNNER_TEMP/$BENCHMARK_STATE_NAME" \
            --max-disk-gib 40

      - name: Remove perplexity corpus
        # The runners are self-hosted, so benchmark inputs are removed explicitly.
        if: ${{ always() }}
        run: |
          rm -rf "$PWD/perplexity-corpus"

      - name: Find latest main benchmark
        id: main_benchmark
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 build_tools/github_actions/find_main_benchmark.py \
            --repository "$GITHUB_REPOSITORY" \
            --workflow ci.yml \
            --branch main \
            --artifact "$BENCHMARK_ARTIFACT_NAME"

      - name: Download latest main benchmark
        id: download_main_benchmark
        if: ${{ steps.main_benchmark.outputs.artifact_id != '' }}
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.main_benchmark.outputs.artifact_id }}
          path: ${{ runner.temp }}/lemonade-main-benchmark-${{ matrix.gpu_target }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.main_benchmark.outputs.run_id }}

      - name: Write Lemonade benchmark report
        env:
          BASELINE_BENCHMARK_DIR: ${{ runner.temp }}/lemonade-main-benchmark-${{ matrix.gpu_target }}
          BASELINE_RUN_URL: ${{ steps.main_benchmark.outputs.run_url }}
        run: |
          python3 scripts/hrx/write_lemonade_benchmark_report.py \
            "$PWD/lemonade-benchmark/benchmark-hrx.json" \
            "$PWD/lemonade-benchmark/benchmark-vulkan.json" \
            --baseline-hrx-benchmark "$BASELINE_BENCHMARK_DIR/benchmark-hrx.json" \
            --baseline-vulkan-benchmark "$BASELINE_BENCHMARK_DIR/benchmark-vulkan.json" \
            --baseline-run-url "$BASELINE_RUN_URL" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Write perplexity report
        env:
          BASELINE_BENCHMARK_DIR: ${{ runner.temp }}/lemonade-main-benchmark-${{ matrix.gpu_target }}
          BASELINE_RUN_URL: ${{ steps.main_benchmark.outputs.run_url }}
        run: |
          python3 scripts/hrx/write_perplexity_report.py \
            "$PWD/lemonade-benchmark/perplexity-hrx.json" \
            "$PWD/lemonade-benchmark/perplexity-vulkan.json" \
            --baseline-hrx-perplexity "$BASELINE_BENCHMARK_DIR/perplexity-hrx.json" \
            --baseline-vulkan-perplexity "$BASELINE_BENCHMARK_DIR/perplexity-vulkan.json" \
            --baseline-run-url "$BASELINE_RUN_URL" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark results
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.BENCHMARK_ARTIFACT_NAME }}
          path: |
            lemonade-benchmark/benchmark-hrx.json
            lemonade-benchmark/benchmark-vulkan.json
            lemonade-benchmark/perplexity-hrx.json
            lemonade-benchmark/perplexity-vulkan.json
            lemonade-benchmark/metadata.json
          if-no-files-found: error
          retention-days: 45

      - name: Upload benchmark debug logs
        # Preserve diagnostics when the benchmark or report step fails.
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lemonade-bench-debug-log-${{ matrix.gpu_target }}
          path: |
            lemonade-benchmark-debug/lemond-hrx.log
            lemonade-benchmark-debug/lemond-vulkan.log
            lemonade-benchmark-debug/responses-hrx.jsonl
            lemonade-benchmark-debug/responses-vulkan.jsonl
            lemonade-benchmark-debug/perplexity-hrx.log
            lemonade-benchmark-debug/perplexity-vulkan.log
          if-no-files-found: warn

      - name: Fail incomplete benchmark
        if: ${{ always() && steps.benchmark.outcome == 'failure' }}
        run: |
          echo "One or more benchmark batches failed." >&2
          exit 1
