name: Benchmark llama.cpp Release Linux

on:
  workflow_call:
    inputs:
      name:
        type: string
        default: Release tests
      release_artifact_name:
        type: string
        required: true
      test_artifact_name:
        type: string
        default: llama-cpp-linux-x86_64-tests
      package_root_name:
        type: string
        default: llama.cpp-install
      # WARNING: All models listed here will be pulled from Hugging Face during the benchmark.
      models:
        description: Space-separated Lemonade model names to benchmark.
        type: string
        default: Qwen3-30B-A3B-Instruct-2507-GGUF
      allow_failure:
        description: Allow release validation jobs to fail without failing the calling workflow.
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  benchmark_llama_cpp_release_linux:
    name: ${{ inputs.name }} (${{ matrix.gpu_target }})
    continue-on-error: ${{ inputs.allow_failure }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - gpu_target: gfx1151
            runs_on: linux-gfx1151-gpu-rocm
          # - gpu_target: gfx1201
          #   runs_on: linux-gfx120X-gpu-rocm
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 60
    env:
      BENCHMARK_ARTIFACT_NAME: lemonade-bench-${{ matrix.gpu_target }}
      BENCHMARK_STATE_NAME: lemonade-bench-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.gpu_target }}
    steps:
      - name: Checkout automation repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout Lemonade HRX integration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AaronStGeorge/lemonade
          ref: hrx-integration
          path: lemonade-source
          persist-credentials: false

      - name: Record source commits
        id: sources
        run: |
          set -euo pipefail
          echo "llama_cpp=$(git rev-parse HEAD:llama.cpp)" >> "$GITHUB_OUTPUT"
          echo "hrx_system=$(git rev-parse HEAD:hrx-system)" >> "$GITHUB_OUTPUT"
          echo "lemonade=$(git -C lemonade-source rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Download llama.cpp release package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.release_artifact_name }}
          path: artifacts

      - name: Extract release package
        env:
          RELEASE_ARTIFACT_NAME: ${{ inputs.release_artifact_name }}
        run: |
          release_package="artifacts/${RELEASE_ARTIFACT_NAME}.tar.gz"
          extract_dir="release"

          rm -rf "$extract_dir"
          mkdir -p "$extract_dir"

          tar -xzf "$release_package" -C "$extract_dir"

      - name: Build Lemonade
        run: |
          python3 scripts/hrx/build_lemonade.py \
            --source-dir "$PWD/lemonade-source" \
            --build-dir "$PWD/lemonade-source/build"

      - name: Write benchmark metadata
        env:
          HRX_SYSTEM_COMMIT: ${{ steps.sources.outputs.hrx_system }}
          LEMONADE_COMMIT: ${{ steps.sources.outputs.lemonade }}
          LLAMA_CPP_COMMIT: ${{ steps.sources.outputs.llama_cpp }}
        run: |
          python3 scripts/hrx/write_benchmark_metadata.py \
            --output "$PWD/lemonade-benchmark/metadata.json" \
            --llama-cpp-commit "$LLAMA_CPP_COMMIT" \
            --hrx-system-commit "$HRX_SYSTEM_COMMIT" \
            --lemonade-commit "$LEMONADE_COMMIT"

      - name: Run Lemonade HRX benchmark
        env:
          LEMONADE_MODELS: ${{ inputs.models }}
          PACKAGE_ROOT_NAME: ${{ inputs.package_root_name }}
        run: |
          read -r -a models <<< "$LEMONADE_MODELS"
          python3 scripts/hrx/run_lemonade_benchmark.py \
            --lemonade-build-dir "$PWD/lemonade-source/build" \
            --llama-server "$PWD/release/$PACKAGE_ROOT_NAME/bin/llama-server" \
            --state-root "$RUNNER_TEMP/$BENCHMARK_STATE_NAME" \
            --output "$PWD/lemonade-benchmark/benchmark.json" \
            --server-log "$PWD/lemonade-benchmark-debug/lemond.log" \
            --models "${models[@]}"

      - name: Upload Lemonade benchmark
        if: ${{ success() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.BENCHMARK_ARTIFACT_NAME }}
          path: |
            lemonade-benchmark/benchmark.json
            lemonade-benchmark/metadata.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload Lemonade debug log
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lemonade-bench-debug-log-${{ matrix.gpu_target }}
          path: lemonade-benchmark-debug/lemond.log
          if-no-files-found: warn
